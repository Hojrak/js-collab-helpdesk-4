<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpdesk Dominik Ziętara</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>Helpdesk</h1>

      <form id="ticket-form">
        <label for="title">Tytuł zgłoszenia</label>
        <input id="title" name="title" maxlength="80" />

        <label for="priority">Priorytet</label>
        <select id="priority" name="priority">
          <option value="high">Wysoki</option>
          <option value="normal" selected>Normalny</option>
          <option value="low">Niski</option>
        </select>

        <button id="submit" type="submit">Dodaj</button>
      </form>

      <div class="filter-controls">
        <label for="filter">Filtr</label>
        <select id="filter">
          <option value="all">Wszystkie</option>
          <option value="new">Nowe</option>
          <option value="doing">W trakcie</option>
          <option value="done">Zakończone</option>
        </select>
      </div>

      <p id="message" role="status"></p>
      <section class="tickets-section">
        <div class="tickets-header">
          <h2 id="tickets-header">Zgłoszenia</h2>
          <p id="counter">0 / 0</p>
        </div>
        <ol id="tickets"></ol>
      </section>

      <script defer src="app.js"></script>
    </div>
  </body>
</html>
